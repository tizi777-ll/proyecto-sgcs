<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" width="620" height="240" role="img" aria-labelledby="t"><title id="t">Modelo iterativo e incremental</title>
<rect width="620" height="240" fill="#fff"/>
<g font-family="Arial, sans-serif" font-size="14" fill="#2d3b50" text-anchor="middle">
