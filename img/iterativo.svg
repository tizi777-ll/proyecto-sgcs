<text x="105" y="56" font-weight="bold">Iteración 1</text><text x="105" y="80">Planificar</text><text x="105" y="100">Construir</text><text x="105" y="120">Probar</text>
<text x="310" y="56" font-weight="bold">Iteración 2</text><text x="310" y="80">Revisar</text><text x="310" y="100">Agregar funciones</text><text x="310" y="120">Probar</text>
